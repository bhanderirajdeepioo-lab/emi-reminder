<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"
     font-family="-apple-system, system-ui, sans-serif" stroke="none">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#EEF2FF"/>

  <!-- Status bar -->
  <rect width="390" height="48" fill="#4F46E5"/>
  <text x="16" y="32" font-size="12" fill="#C7D2FE">9:41</text>
  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#C7D2FE"/>

  <!-- App bar (gradient) -->
  <rect x="0" y="48" width="390" height="56" fill="url(#hdr)"/>
  <text x="20" y="82" font-size="22" fill="#FFFFFF">←</text>
  <text x="195" y="83" font-size="17" font-weight="800" text-anchor="middle" fill="#FFFFFF">Finance Accounts</text>

  <!-- SMS Intelligence toggle row -->
  <rect x="0" y="104" width="390" height="56" fill="#FFFFFF"/>
  <rect x="0" y="159" width="390" height="1" fill="#E2E8F0"/>
  <text x="20" y="128" font-size="14" font-weight="700" fill="#1E293B">SMS Intelligence</text>
  <text x="20" y="148" font-size="11" fill="#64748B">Auto-detect transactions from bank SMS</text>
  <!-- Toggle ON (green pill) -->
  <rect x="328" y="120" width="44" height="24" rx="12" fill="#059669"/>
  <circle cx="360" cy="132" r="10" fill="#FFFFFF"/>

  <!-- Last synced footer -->
  <rect x="0" y="160" width="390" height="36" fill="#F8FAFC"/>
  <rect x="0" y="195" width="390" height="1" fill="#E2E8F0"/>
  <text x="20" y="183" font-size="11" fill="#94A3B8">⟳  Last synced · 3 minutes ago</text>

  <!-- DETECTED ACCOUNTS section label -->
  <text x="16" y="222" font-size="11" font-weight="700" fill="#64748B">DETECTED ACCOUNTS (3 BANKS · 4 ACCOUNTS)</text>

  <!-- ===== HDFC Bank group ===== -->
  <rect x="12" y="230" width="366" height="176" rx="14" fill="#FFFFFF"/>

  <!-- Bank header row -->
  <rect x="24" y="242" width="32" height="20" rx="4" fill="#4F46E5"/>
  <text x="40" y="257" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">HDFC</text>
  <text x="64" y="257" font-size="13" font-weight="700" fill="#1E293B">HDFC Bank</text>
  <rect x="314" y="246" width="56" height="18" rx="9" fill="#EEF2FF"/>
  <text x="342" y="259" font-size="10" text-anchor="middle" fill="#4F46E5">2 accounts</text>

  <!-- Divider -->
  <rect x="24" y="270" width="342" height="1" fill="#F1F5F9"/>

  <!-- Account 1: Salary -->
  <rect x="24" y="278" width="342" height="52" rx="10" fill="#F8FAFC"/>
  <circle cx="46" cy="304" r="14" fill="#EEF2FF"/>
  <text x="46" y="308" font-size="10" text-anchor="middle" fill="#4F46E5">💳</text>
  <text x="68" y="298" font-size="13" font-weight="600" fill="#1E293B">Salary Account</text>
  <text x="68" y="316" font-size="11" fill="#64748B">Account ·· 1234 · 23 transactions</text>
  <!-- Edit icon -->
  <circle cx="344" cy="304" r="14" fill="#EEF2FF"/>
  <text x="344" y="308" font-size="12" text-anchor="middle" fill="#4F46E5">✏</text>

  <!-- Account 2: Savings -->
  <rect x="24" y="338" width="342" height="52" rx="10" fill="#F8FAFC"/>
  <circle cx="46" cy="364" r="14" fill="#EEF2FF"/>
  <text x="46" y="368" font-size="10" text-anchor="middle" fill="#4F46E5">💳</text>
  <text x="68" y="358" font-size="13" font-weight="600" fill="#1E293B">Savings Account</text>
  <text x="68" y="376" font-size="11" fill="#64748B">Account ·· 5678 · 8 transactions</text>
  <!-- Edit icon -->
  <circle cx="344" cy="364" r="14" fill="#EEF2FF"/>
  <text x="344" y="368" font-size="12" text-anchor="middle" fill="#4F46E5">✏</text>

  <!-- Divider before add -->
  <rect x="24" y="396" width="342" height="1" fill="#F1F5F9"/>
  <text x="24" y="412" font-size="11" fill="#4F46E5">+ Add account from HDFC</text>

  <!-- ===== SBI group ===== -->
  <rect x="12" y="418" width="366" height="130" rx="14" fill="#FFFFFF"/>

  <!-- SBI header -->
  <rect x="24" y="430" width="32" height="20" rx="4" fill="#1E40AF"/>
  <text x="40" y="445" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">SBI</text>
  <text x="64" y="445" font-size="13" font-weight="700" fill="#1E293B">State Bank of India</text>
  <rect x="314" y="434" width="56" height="18" rx="9" fill="#EEF2FF"/>
  <text x="342" y="447" font-size="10" text-anchor="middle" fill="#4F46E5">1 account</text>

  <!-- Divider -->
  <rect x="24" y="458" width="342" height="1" fill="#F1F5F9"/>

  <!-- SBI Account (unlabelled — shows "Add label" prompt) -->
  <rect x="24" y="466" width="342" height="60" rx="10" fill="#FFFBEB"/>
  <circle cx="46" cy="496" r="14" fill="#FFF7ED"/>
  <text x="46" y="500" font-size="10" text-anchor="middle" fill="#D97706">💳</text>
  <text x="68" y="490" font-size="13" font-weight="600" fill="#1E293B">Account ·· 4321</text>
  <text x="68" y="508" font-size="11" fill="#64748B">18 transactions · No label yet</text>
  <!-- "Add label" CTA chip -->
  <rect x="68" y="514" width="72" height="16" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="104" y="525" font-size="9" text-anchor="middle" fill="#D97706">+ Add label</text>
  <!-- Edit icon -->
  <circle cx="344" cy="492" r="14" fill="#FFF7ED"/>
  <text x="344" y="496" font-size="12" text-anchor="middle" fill="#D97706">✏</text>

  <!-- SBI divider + add -->
  <rect x="24" y="534" width="342" height="1" fill="#F1F5F9"/>
  <text x="24" y="548" font-size="11" fill="#4F46E5">+ Add account from SBI</text>

  <!-- ===== ICICI group ===== -->
  <rect x="12" y="562" width="366" height="116" rx="14" fill="#FFFFFF"/>

  <!-- ICICI header -->
  <rect x="24" y="574" width="36" height="20" rx="4" fill="#B91C1C"/>
  <text x="42" y="589" font-size="9" font-weight="700" text-anchor="middle" fill="#FFFFFF">ICICI</text>
  <text x="68" y="589" font-size="13" font-weight="700" fill="#1E293B">ICICI Bank</text>
  <rect x="314" y="578" width="56" height="18" rx="9" fill="#EEF2FF"/>
  <text x="342" y="591" font-size="10" text-anchor="middle" fill="#4F46E5">1 account</text>

  <!-- Divider -->
  <rect x="24" y="602" width="342" height="1" fill="#F1F5F9"/>

  <!-- ICICI Account -->
  <rect x="24" y="610" width="342" height="52" rx="10" fill="#F8FAFC"/>
  <circle cx="46" cy="636" r="14" fill="#EEF2FF"/>
  <text x="46" y="640" font-size="10" text-anchor="middle" fill="#4F46E5">💳</text>
  <text x="68" y="630" font-size="13" font-weight="600" fill="#1E293B">Account ·· 9876</text>
  <text x="68" y="648" font-size="11" fill="#64748B">5 transactions</text>
  <circle cx="344" cy="636" r="14" fill="#EEF2FF"/>
  <text x="344" y="640" font-size="12" text-anchor="middle" fill="#4F46E5">✏</text>

  <!-- Add manual account CTA -->
  <rect x="12" y="690" width="366" height="44" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="195" y="717" font-size="13" font-weight="600" text-anchor="middle" fill="#4F46E5">+ Add account manually</text>

  <!-- Privacy note -->
  <rect x="12" y="746" width="366" height="36" rx="10" fill="#F0FDF4"/>
  <text x="195" y="761" font-size="10" text-anchor="middle" fill="#064E3B">🔒 Account labels are stored only on your device</text>
  <text x="195" y="776" font-size="10" text-anchor="middle" fill="#064E3B">and never uploaded.</text>

  <!-- Bottom nav -->
  <rect x="0" y="796" width="390" height="48" fill="#FFFFFF"/>
  <rect x="0" y="796" width="390" height="1" fill="#E2E8F0"/>
  <text x="49" y="815" font-size="16" text-anchor="middle" fill="#94A3B8">🏠</text>
  <text x="49" y="834" font-size="9" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="815" font-size="16" text-anchor="middle" fill="#94A3B8">⚡</text>
  <text x="147" y="834" font-size="9" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="244" y="815" font-size="16" text-anchor="middle" fill="#94A3B8">🔔</text>
  <text x="244" y="834" font-size="9" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <rect x="297" y="798" width="88" height="44" rx="12" fill="#EEF2FF"/>
  <text x="341" y="815" font-size="16" text-anchor="middle" fill="#4F46E5">💰</text>
  <text x="341" y="834" font-size="9" font-weight="700" text-anchor="middle" fill="#4F46E5">Finance</text>

  <!-- Annotation callouts -->
  <circle cx="378" cy="132" r="12" fill="#FFFFFF" stroke="#d33" stroke-dasharray="4 2" stroke-width="1.5"/>
  <text x="378" y="136" font-size="12" font-weight="700" text-anchor="middle" fill="#d33">1</text>
  <circle cx="378" cy="290" r="12" fill="#FFFFFF" stroke="#d33" stroke-dasharray="4 2" stroke-width="1.5"/>
  <text x="378" y="294" font-size="12" font-weight="700" text-anchor="middle" fill="#d33">2</text>
  <circle cx="378" cy="492" r="12" fill="#FFFBEB" stroke="#d33" stroke-dasharray="4 2" stroke-width="1.5"/>
  <text x="378" y="496" font-size="12" font-weight="700" text-anchor="middle" fill="#d33">3</text>
  <circle cx="378" cy="712" r="12" fill="#FFFFFF" stroke="#d33" stroke-dasharray="4 2" stroke-width="1.5"/>
  <text x="378" y="716" font-size="12" font-weight="700" text-anchor="middle" fill="#d33">4</text>
  <circle cx="378" cy="762" r="12" fill="#F0FDF4" stroke="#d33" stroke-dasharray="4 2" stroke-width="1.5"/>
  <text x="378" y="766" font-size="12" font-weight="700" text-anchor="middle" fill="#d33">5</text>
</svg>
