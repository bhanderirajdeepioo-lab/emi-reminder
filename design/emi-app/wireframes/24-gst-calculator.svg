<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"
     font-family="-apple-system, system-ui, sans-serif" stroke="none">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#ECFEFF"/>

  <!-- Status bar -->
  <rect width="390" height="48" fill="#0891B2"/>
  <text x="16" y="32" font-size="12" fill="#CFFAFE">9:41</text>
  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#CFFAFE" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#CFFAFE"/>

  <!-- Coming-soon ribbon -->
  <rect width="390" height="20" y="48" fill="#0E7490"/>
  <text x="195" y="62" font-size="10" font-weight="700" text-anchor="middle" fill="#CFFAFE">🔒  COMING SOON — Launching Q3 2026</text>

  <!-- Header -->
  <rect x="0" y="68" width="390" height="56" fill="url(#hdr)"/>
  <text x="20" y="104" font-size="20" fill="#FFFFFF">←</text>
  <text x="195" y="104" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">GST Calculator</text>

  <!-- Mode toggle: Add GST / Remove GST -->
  <rect x="16" y="136" width="358" height="38" rx="10" fill="#164E63"/>
  <rect x="18" y="138" width="175" height="34" rx="8" fill="#FFFFFF"/>
  <text x="105" y="159" font-size="13" font-weight="700" text-anchor="middle" fill="#0891B2">Add GST</text>
  <text x="286" y="159" font-size="13" text-anchor="middle" fill="#CFFAFE">Remove GST</text>

  <!-- Amount card -->
  <rect x="16" y="186" width="358" height="72" rx="14" fill="#FFFFFF"/>
  <text x="32" y="206" font-size="11" fill="#64748B">Original Amount (excl. GST)</text>
  <text x="32" y="242" font-size="26" font-weight="800" fill="#1E293B">₹ 10,000</text>

  <!-- GST Rate chips -->
  <rect x="16" y="270" width="358" height="56" rx="14" fill="#FFFFFF"/>
  <text x="32" y="290" font-size="11" fill="#64748B">GST Rate</text>
  <rect x="32" y="300" width="64" height="16" rx="8" fill="#0891B2"/>
  <text x="64" y="312" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">5%</text>
  <rect x="104" y="300" width="64" height="16" rx="8" fill="#CFFAFE"/>
  <text x="136" y="312" font-size="11" text-anchor="middle" fill="#0E7490">12%</text>
  <rect x="176" y="300" width="64" height="16" rx="8" fill="#CFFAFE"/>
  <text x="208" y="312" font-size="11" text-anchor="middle" fill="#0E7490">18%</text>
  <rect x="248" y="300" width="64" height="16" rx="8" fill="#CFFAFE"/>
  <text x="280" y="312" font-size="11" text-anchor="middle" fill="#0E7490">28%</text>

  <!-- HSN / Category search -->
  <rect x="16" y="338" width="358" height="48" rx="14" fill="#FFFFFF"/>
  <text x="32" y="358" font-size="11" fill="#64748B">HSN Code / Category (optional)</text>
  <rect x="32" y="366" width="280" height="12" rx="4" fill="#F1F5F9"/>
  <text x="44" y="376" font-size="10" fill="#94A3B8">e.g. 0401 – Milk, 8471 – Laptops</text>

  <!-- Section label -->
  <text x="16" y="406" font-size="11" font-weight="700" fill="#64748B">GST BREAKDOWN</text>

  <!-- Hero result (locked) -->
  <rect x="16" y="414" width="358" height="76" rx="16" fill="#1E293B"/>
  <text x="195" y="446" font-size="12" text-anchor="middle" fill="#64748B">Total (incl. GST)</text>
  <text x="195" y="482" font-size="28" font-weight="800" text-anchor="middle" fill="#334155">₹ ——,———</text>

  <!-- 3-up result cards (locked) -->
  <rect x="16" y="502" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="70" y="524" font-size="10" text-anchor="middle" fill="#94A3B8">GST Amount</text>
  <text x="70" y="556" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,———</text>

  <rect x="141" y="502" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="195" y="524" font-size="10" text-anchor="middle" fill="#94A3B8">CGST (50%)</text>
  <text x="195" y="556" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,———</text>

  <rect x="266" y="502" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="320" y="524" font-size="10" text-anchor="middle" fill="#94A3B8">SGST (50%)</text>
  <text x="320" y="556" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,———</text>

  <!-- Coming soon card -->
  <rect x="16" y="582" width="358" height="90" rx="16" fill="#FFFFFF"/>
  <text x="195" y="618" font-size="24" text-anchor="middle">🔒</text>
  <text x="195" y="644" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">GST Calculator Coming Soon</text>
  <text x="195" y="662" font-size="11" text-anchor="middle" fill="#64748B">CGST + SGST / IGST split, HSN lookup — Q3 2026</text>

  <!-- Invoice placeholder -->
  <rect x="16" y="684" width="358" height="48" rx="14" fill="#F8FAFC"/>
  <text x="195" y="712" font-size="11" text-anchor="middle" fill="#CBD5E1">Share GST Invoice  ↗</text>

  <!-- CTA (disabled) -->
  <rect x="16" y="744" width="358" height="48" rx="14" fill="#CFFAFE"/>
  <text x="195" y="774" font-size="14" font-weight="700" text-anchor="middle" fill="#67E8F9">Calculate GST →</text>

  <!-- Bottom nav - floating pill bar (Home · Calculator · Reminders · Finance) -->
  <rect x="12" y="798" width="366" height="42" rx="21" fill="#FFFFFF"/>
  <rect x="268" y="801" width="104" height="36" rx="18" fill="#4F46E5"/>
  <text x="60" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="230" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <text x="320" y="824" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">Finance</text>
</svg>
