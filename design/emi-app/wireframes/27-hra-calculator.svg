  <rect x="16" y="438" width="358" height="76" rx="16" fill="#1E293B"/>
  <text x="195" y="470" font-size="12" text-anchor="middle" fill="#64748B">HRA Exemption (Annual)</text>
  <text x="195" y="506" font-size="28" font-weight="800" text-anchor="middle" fill="#334155">₹ ——,——,———</text>

