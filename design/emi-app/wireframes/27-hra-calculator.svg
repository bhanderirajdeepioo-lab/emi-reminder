  <text x="32" y="242" font-size="26" font-weight="800" fill="#1E293B">₹ 50,000</text>

  <!-- HRA Received + Rent Paid row -->
  <rect x="16" y="270" width="172" height="72" rx="14" fill="#FFFFFF"/>
  <text x="32" y="290" font-size="11" fill="#64748B">HRA Received</text>
  <text x="32" y="320" font-size="18" font-weight="700" fill="#7C3AED">₹ 20,000</text>
  <text x="32" y="336" font-size="10" fill="#94A3B8">per month</text>

  <rect x="202" y="270" width="172" height="72" rx="14" fill="#FFFFFF"/>
  <text x="218" y="290" font-size="11" fill="#64748B">Actual Rent Paid</text>
  <text x="218" y="320" font-size="18" font-weight="700" fill="#7C3AED">₹ 25,000</text>
  <text x="218" y="336" font-size="10" fill="#94A3B8">per month</text>

  <!-- Rule explainer -->
  <rect x="16" y="354" width="358" height="56" rx="14" fill="#FFFFFF"/>
  <text x="32" y="374" font-size="11" fill="#64748B">HRA Exemption is least of these 3 rules:</text>
  <text x="32" y="392" font-size="10" fill="#94A3B8">① Actual HRA received   ② 50% of basic (Metro)   ③ Rent − 10% of basic</text>
  <text x="32" y="406" font-size="10" fill="#7C3AED">Tap to see each rule calculation →</text>

  <!-- Section label -->
  <text x="16" y="430" font-size="11" font-weight="700" fill="#64748B">EXEMPTION SUMMARY</text>

