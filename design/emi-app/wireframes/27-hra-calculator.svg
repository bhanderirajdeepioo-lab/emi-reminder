  <rect x="16" y="526" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="70" y="548" font-size="10" text-anchor="middle" fill="#94A3B8">Taxable HRA</text>
  <text x="70" y="580" font-size="13" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,——,———</text>

  <rect x="141" y="526" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="195" y="548" font-size="10" text-anchor="middle" fill="#94A3B8">Tax Saved</text>
  <text x="195" y="580" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,——,———</text>

  <rect x="266" y="526" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="320" y="548" font-size="10" text-anchor="middle" fill="#94A3B8">Monthly Saving</text>
  <text x="320" y="580" font-size="13" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,———</text>

  <!-- Coming soon card -->
  <rect x="16" y="606" width="358" height="90" rx="16" fill="#FFFFFF"/>
  <text x="195" y="642" font-size="24" text-anchor="middle">🔒</text>
  <text x="195" y="668" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">HRA Calculator Coming Soon</text>
  <text x="195" y="686" font-size="11" text-anchor="middle" fill="#64748B">Sec 10(13A) rule-wise breakdown — launching Q3 2026</text>

  <!-- Proof documents note -->
  <rect x="16" y="708" width="358" height="36" rx="14" fill="#F8FAFC"/>
  <text x="195" y="730" font-size="11" text-anchor="middle" fill="#CBD5E1">Documents needed: Rent receipt + Form 16  (guide coming soon)</text>

  <!-- CTA (disabled) -->
  <rect x="16" y="756" width="358" height="36" rx="14" fill="#EDE9FE"/>
  <text x="195" y="778" font-size="14" font-weight="700" text-anchor="middle" fill="#C4B5FD">Calculate HRA Exemption →</text>

  <!-- Bottom nav - floating pill bar (Home · Calculator · Reminders · Finance) -->
  <rect x="12" y="798" width="366" height="42" rx="21" fill="#FFFFFF"/>
  <rect x="268" y="801" width="104" height="36" rx="18" fill="#4F46E5"/>
  <text x="60" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="230" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <text x="320" y="824" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">Finance</text>
