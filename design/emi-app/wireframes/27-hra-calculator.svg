  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#EDE9FE" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#EDE9FE"/>

  <!-- Coming-soon ribbon -->
  <rect width="390" height="20" y="48" fill="#6D28D9"/>
