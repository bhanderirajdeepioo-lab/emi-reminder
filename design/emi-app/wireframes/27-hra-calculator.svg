  <text x="195" y="104" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">HRA Calculator</text>

  <!-- City toggle: Metro / Non-Metro -->
  <rect x="16" y="136" width="358" height="38" rx="10" fill="#4C1D95"/>
