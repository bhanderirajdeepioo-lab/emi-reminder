  <text x="105" y="159" font-size="13" font-weight="700" text-anchor="middle" fill="#7C3AED">Metro City</text>
  <text x="286" y="159" font-size="13" text-anchor="middle" fill="#EDE9FE">Non-Metro</text>

  <!-- Basic Salary card -->
  <rect x="16" y="186" width="358" height="72" rx="14" fill="#FFFFFF"/>
