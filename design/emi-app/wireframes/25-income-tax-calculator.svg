<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"
     font-family="-apple-system, system-ui, sans-serif" stroke="none">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#EFF6FF"/>

  <!-- Status bar -->
  <rect width="390" height="48" fill="#1D4ED8"/>
  <text x="16" y="32" font-size="12" fill="#BFDBFE">9:41</text>
  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#BFDBFE"/>

  <!-- Coming-soon ribbon -->
  <rect width="390" height="20" y="48" fill="#1E40AF"/>
  <text x="195" y="62" font-size="10" font-weight="700" text-anchor="middle" fill="#BFDBFE">🔒  COMING SOON — Launching Q3 2026</text>

  <!-- Header -->
  <rect x="0" y="68" width="390" height="56" fill="url(#hdr)"/>
  <text x="20" y="104" font-size="20" fill="#FFFFFF">←</text>
  <text x="195" y="104" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">Income Tax Calculator</text>

  <!-- Tax regime toggle: Old / New -->
  <rect x="16" y="136" width="358" height="38" rx="10" fill="#1E3A8A"/>
  <rect x="18" y="138" width="175" height="34" rx="8" fill="#FFFFFF"/>
  <text x="105" y="159" font-size="13" font-weight="700" text-anchor="middle" fill="#1D4ED8">New Regime</text>
  <text x="286" y="159" font-size="13" text-anchor="middle" fill="#BFDBFE">Old Regime</text>

  <!-- Annual Income card -->
  <rect x="16" y="186" width="358" height="72" rx="14" fill="#FFFFFF"/>
  <text x="32" y="206" font-size="11" fill="#64748B">Annual Income (CTC)</text>
  <text x="32" y="242" font-size="26" font-weight="800" fill="#1E293B">₹ 12,00,000</text>

  <!-- Deductions row (2 cards) -->
  <rect x="16" y="270" width="172" height="72" rx="14" fill="#FFFFFF"/>
  <text x="32" y="290" font-size="11" fill="#64748B">Sec 80C Deductions</text>
  <text x="32" y="320" font-size="18" font-weight="700" fill="#1D4ED8">₹ 1,50,000</text>
  <text x="32" y="336" font-size="10" fill="#94A3B8">PPF + ELSS + LIC</text>

  <rect x="202" y="270" width="172" height="72" rx="14" fill="#FFFFFF"/>
  <text x="218" y="290" font-size="11" fill="#64748B">Sec 80D Health Ins.</text>
  <text x="218" y="320" font-size="18" font-weight="700" fill="#1D4ED8">₹ 25,000</text>
  <text x="218" y="336" font-size="10" fill="#94A3B8">Self + parents</text>

  <!-- HRA + Standard deduction -->
  <rect x="16" y="354" width="358" height="44" rx="14" fill="#FFFFFF"/>
  <text x="32" y="374" font-size="11" fill="#64748B">Standard Deduction</text>
  <text x="32" y="390" font-size="12" font-weight="700" fill="#1D4ED8">₹ 75,000  <tspan fill="#94A3B8" font-weight="400" font-size="10">(New regime 2024–25)</tspan></text>

  <!-- Section label -->
  <text x="16" y="418" font-size="11" font-weight="700" fill="#64748B">TAX LIABILITY</text>

  <!-- Hero result (locked) -->
  <rect x="16" y="426" width="358" height="76" rx="16" fill="#1E293B"/>
  <text x="195" y="458" font-size="12" text-anchor="middle" fill="#64748B">Total Tax Payable</text>
  <text x="195" y="494" font-size="28" font-weight="800" text-anchor="middle" fill="#334155">₹ ——,——,———</text>

  <!-- 3-up result cards (locked) -->
  <rect x="16" y="514" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="70" y="536" font-size="10" text-anchor="middle" fill="#94A3B8">Taxable Income</text>
  <text x="70" y="568" font-size="13" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,——,———</text>

  <rect x="141" y="514" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="195" y="536" font-size="10" text-anchor="middle" fill="#94A3B8">Eff. Tax Rate</text>
  <text x="195" y="568" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">—.—%</text>

  <rect x="266" y="514" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="320" y="536" font-size="10" text-anchor="middle" fill="#94A3B8">Monthly TDS</text>
  <text x="320" y="568" font-size="13" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,———</text>

  <!-- Coming soon card -->
  <rect x="16" y="594" width="358" height="90" rx="16" fill="#FFFFFF"/>
  <text x="195" y="630" font-size="24" text-anchor="middle">🔒</text>
  <text x="195" y="656" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">Income Tax Calculator Coming Soon</text>
  <text x="195" y="674" font-size="11" text-anchor="middle" fill="#64748B">Old vs New regime comparison — launching Q3 2026</text>

  <!-- Slab table placeholder -->
  <rect x="16" y="696" width="358" height="36" rx="14" fill="#F8FAFC"/>
  <text x="195" y="718" font-size="11" text-anchor="middle" fill="#CBD5E1">Tax Slab Breakdown Table  (coming soon)</text>

  <!-- CTA (disabled) -->
  <rect x="16" y="744" width="358" height="48" rx="14" fill="#DBEAFE"/>
  <text x="195" y="774" font-size="14" font-weight="700" text-anchor="middle" fill="#93C5FD">Calculate Tax →</text>

  <!-- Bottom nav - floating pill bar (Home · Calculator · Reminders · Finance) -->
  <rect x="12" y="798" width="366" height="42" rx="21" fill="#FFFFFF"/>
  <rect x="268" y="801" width="104" height="36" rx="18" fill="#4F46E5"/>
  <text x="60" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="230" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <text x="320" y="824" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">Finance</text>
</svg>
