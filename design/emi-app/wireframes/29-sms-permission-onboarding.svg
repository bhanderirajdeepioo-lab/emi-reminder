<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"
     font-family="-apple-system, system-ui, sans-serif" stroke="none">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FFFFFF"/>

  <!-- Status bar -->
  <rect width="390" height="48" fill="#4F46E5"/>
  <text x="16" y="32" font-size="12" fill="#C7D2FE">9:41</text>
  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#C7D2FE"/>

  <!-- Hero gradient area -->
  <rect x="0" y="48" width="390" height="230" fill="url(#heroGrad)"/>

  <!-- Phone illustration (centered in hero) -->
  <rect x="148" y="68" width="94" height="170" rx="16" fill="#FFFFFF" opacity="0.12"/>
  <rect x="154" y="78" width="82" height="148" rx="10" fill="#1E1B4B"/>
  <!-- Screen content (SMS bubbles) -->
  <rect x="160" y="92" width="58" height="20" rx="6" fill="#4338CA"/>
  <text x="189" y="106" font-size="8" text-anchor="middle" fill="#C7D2FE">HDFC Bank</text>
  <rect x="160" y="118" width="70" height="28" rx="6" fill="#312E81"/>
  <text x="167" y="131" font-size="7.5" fill="#A5B4FC">a/c ****4821 debited</text>
  <text x="167" y="142" font-size="7.5" fill="#A5B4FC">Rs.8500 on 05-Jul-26</text>
  <rect x="160" y="152" width="58" height="20" rx="6" fill="#4338CA"/>
  <text x="189" y="166" font-size="8" text-anchor="middle" fill="#C7D2FE">ICICI Bank</text>
  <rect x="160" y="178" width="70" height="20" rx="6" fill="#312E81"/>
  <text x="167" y="192" font-size="7.5" fill="#A5B4FC">EMI Rs.12500 paid</text>

  <!-- Auto-detect badge (right of phone) -->
  <circle cx="270" cy="140" r="22" fill="#059669"/>
  <text x="270" y="147" font-size="18" text-anchor="middle" fill="#FFFFFF">✓</text>
  <text x="270" y="172" font-size="9" text-anchor="middle" fill="#A7F3D0">Detected!</text>

  <!-- Left spark badge -->
  <rect x="26" y="120" width="108" height="38" rx="10" fill="#FFFFFF" opacity="0.92"/>
  <text x="36" y="135" font-size="9" font-weight="700" fill="#4F46E5">⚡ EMI Found</text>
  <text x="36" y="150" font-size="9" font-weight="800" fill="#1E293B">₹8,500/month</text>

  <!-- Headline -->
  <text x="195" y="314" font-size="26" font-weight="800" text-anchor="middle" fill="#1E293B">Let your bank SMS</text>
  <text x="195" y="344" font-size="26" font-weight="800" text-anchor="middle" fill="#4F46E5">do the work</text>

  <text x="195" y="370" font-size="14" text-anchor="middle" fill="#64748B">EMI Reminder reads your bank messages</text>
  <text x="195" y="388" font-size="14" text-anchor="middle" fill="#64748B">on-device to track finances automatically.</text>

  <!-- Benefit 1 -->
  <rect x="24" y="404" width="342" height="52" rx="12" fill="#F8FAFC"/>
  <rect x="36" y="414" width="30" height="30" rx="9" fill="#EEF2FF"/>
  <text x="51" y="434" font-size="16" text-anchor="middle">📲</text>
  <text x="80" y="427" font-size="13" font-weight="700" fill="#1E293B">Auto-detect EMIs</text>
  <text x="80" y="444" font-size="11" fill="#64748B">Finds recurring bank debit patterns for you</text>

  <!-- Benefit 2 -->
  <rect x="24" y="464" width="342" height="52" rx="12" fill="#F8FAFC"/>
  <rect x="36" y="474" width="30" height="30" rx="9" fill="#EEF2FF"/>
  <text x="51" y="494" font-size="16" text-anchor="middle">📊</text>
  <text x="80" y="487" font-size="13" font-weight="700" fill="#1E293B">Track spending automatically</text>
  <text x="80" y="504" font-size="11" fill="#64748B">Categories expenses without any manual entry</text>

  <!-- Benefit 3 -->
  <rect x="24" y="524" width="342" height="52" rx="12" fill="#F8FAFC"/>
  <rect x="36" y="534" width="30" height="30" rx="9" fill="#EEF2FF"/>
  <text x="51" y="554" font-size="16" text-anchor="middle">💰</text>
  <text x="80" y="547" font-size="13" font-weight="700" fill="#1E293B">Finance dashboard</text>
  <text x="80" y="564" font-size="11" fill="#64748B">Full financial picture in one place</text>

  <!-- Privacy note -->
  <rect x="24" y="592" width="342" height="40" rx="10" fill="#F0FDF4"/>
  <text x="40" y="609" font-size="11" fill="#15803D">🔒</text>
  <text x="58" y="607" font-size="11" font-weight="700" fill="#15803D">Parsed on-device. Never uploaded.</text>
  <text x="58" y="622" font-size="10" fill="#166534">Your SMS data never leaves your phone.</text>

  <!-- Primary CTA (green — trust/allow signal) -->
  <rect x="20" y="652" width="350" height="52" rx="14" fill="#059669"/>
  <text x="195" y="683" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">Enable SMS Intelligence</text>

  <!-- Secondary CTA -->
  <text x="195" y="726" font-size="14" text-anchor="middle" fill="#94A3B8">Not now</text>

  <!-- Bottom nav - floating pill bar (Finance tab active) -->
  <rect x="12" y="798" width="366" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="268" y="801" width="104" height="36" rx="18" fill="#4F46E5"/>
  <text x="60" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="230" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <text x="320" y="824" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">Finance</text>
</svg>
