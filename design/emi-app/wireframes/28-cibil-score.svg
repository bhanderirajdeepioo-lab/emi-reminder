<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"
     font-family="-apple-system, system-ui, sans-serif" stroke="none">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <!-- Gauge arc gradient: poor → excellent -->
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#DC2626"/>
      <stop offset="25%"  stop-color="#F97316"/>
      <stop offset="50%"  stop-color="#EAB308"/>
      <stop offset="75%"  stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FEF2F2"/>

  <!-- Status bar -->
  <rect width="390" height="48" fill="#DC2626"/>
  <text x="16" y="32" font-size="12" fill="#FEE2E2">9:41</text>
  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#FEE2E2" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#FEE2E2"/>

  <!-- Coming-soon ribbon -->
  <rect width="390" height="20" y="48" fill="#B91C1C"/>
  <text x="195" y="62" font-size="10" font-weight="700" text-anchor="middle" fill="#FEE2E2">🔒  COMING SOON — Launching Q3 2026</text>

  <!-- Header -->
  <rect x="0" y="68" width="390" height="56" fill="url(#hdr)"/>
  <text x="20" y="104" font-size="20" fill="#FFFFFF">←</text>
  <text x="195" y="104" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">CIBIL Score Guide</text>

  <!-- Score input card -->
  <rect x="16" y="136" width="358" height="72" rx="14" fill="#FFFFFF"/>
  <text x="32" y="156" font-size="11" fill="#64748B">Your CIBIL Score (300 – 900)</text>
  <text x="32" y="192" font-size="26" font-weight="800" fill="#1E293B">7 5 0</text>
  <text x="180" y="192" font-size="14" fill="#94A3B8">/ 900</text>

  <!-- Score gauge (semi-circle representation) -->
  <rect x="16" y="220" width="358" height="120" rx="14" fill="#FFFFFF"/>
  <!-- Gauge arc background (gray) -->
  <path d="M 55 310 A 140 140 0 0 1 335 310" fill="none" stroke="#E2E8F0" stroke-width="18" stroke-linecap="round"/>
  <!-- Gauge arc colored segment -->
  <path d="M 55 310 A 140 140 0 0 1 260 245" fill="none" stroke="url(#gauge)" stroke-width="18" stroke-linecap="round"/>
  <!-- Needle -->
  <line x1="195" y1="310" x2="225" y2="248" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="195" cy="310" r="6" fill="#1E293B"/>
  <!-- Score labels -->
  <text x="50" y="326" font-size="9" text-anchor="middle" fill="#DC2626">300</text>
  <text x="122" y="245" font-size="9" text-anchor="middle" fill="#F97316">550</text>
  <text x="195" y="232" font-size="9" text-anchor="middle" fill="#EAB308">670</text>
  <text x="268" y="245" font-size="9" text-anchor="middle" fill="#22C55E">750</text>
  <text x="340" y="326" font-size="9" text-anchor="middle" fill="#15803D">900</text>
  <!-- Center score display -->
  <text x="195" y="300" font-size="22" font-weight="800" text-anchor="middle" fill="#1E293B">750</text>
  <text x="195" y="318" font-size="10" text-anchor="middle" fill="#22C55E">Good ●</text>

  <!-- Score bands table -->
  <rect x="16" y="352" width="358" height="148" rx="14" fill="#FFFFFF"/>
  <text x="32" y="374" font-size="12" font-weight="700" fill="#1E293B">Score Bands &amp; Loan Eligibility</text>
  <!-- Band rows -->
  <rect x="32" y="382" width="310" height="18" rx="4" fill="#FEE2E2"/>
  <rect x="32" y="382" width="4" height="18" rx="2" fill="#DC2626"/>
  <text x="44" y="395" font-size="10" fill="#1E293B">300–549  Poor</text>
  <text x="240" y="395" font-size="10" fill="#DC2626">High risk – likely rejected</text>

  <rect x="32" y="404" width="310" height="18" rx="4" fill="#FFF7ED"/>
  <rect x="32" y="404" width="4" height="18" rx="2" fill="#F97316"/>
  <text x="44" y="417" font-size="10" fill="#1E293B">550–649  Fair</text>
  <text x="240" y="417" font-size="10" fill="#F97316">Higher rate, small loans only</text>

  <rect x="32" y="426" width="310" height="18" rx="4" fill="#FEFCE8"/>
  <rect x="32" y="426" width="4" height="18" rx="2" fill="#EAB308"/>
  <text x="44" y="439" font-size="10" fill="#1E293B">650–749  Good</text>
  <text x="240" y="439" font-size="10" fill="#EAB308">Standard rate – approved</text>

  <rect x="32" y="448" width="310" height="18" rx="4" fill="#F0FDF4"/>
  <rect x="32" y="448" width="4" height="18" rx="2" fill="#22C55E"/>
  <text x="44" y="461" font-size="10" fill="#1E293B">750–799  Very Good</text>
  <text x="240" y="461" font-size="10" fill="#22C55E">Better rate – easier approval</text>

  <rect x="32" y="470" width="310" height="18" rx="4" fill="#F0FDF4"/>
  <rect x="32" y="470" width="4" height="18" rx="2" fill="#15803D"/>
  <text x="44" y="483" font-size="10" fill="#1E293B">800–900  Excellent</text>
  <text x="240" y="483" font-size="10" fill="#15803D">Best rate – pre-approved offers</text>

  <!-- Coming soon card -->
  <rect x="16" y="512" width="358" height="90" rx="16" fill="#FFFFFF"/>
  <text x="195" y="548" font-size="24" text-anchor="middle">🔒</text>
  <text x="195" y="574" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">CIBIL Score Guide Coming Soon</text>
  <text x="195" y="592" font-size="11" text-anchor="middle" fill="#64748B">Score tips, factors, free check link — Q3 2026</text>

  <!-- Tips placeholder -->
  <rect x="16" y="614" width="358" height="100" rx="14" fill="#F8FAFC"/>
  <text x="32" y="636" font-size="11" font-weight="700" fill="#CBD5E1">How to improve your CIBIL score</text>
  <rect x="32" y="646" width="280" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="32" y="662" width="240" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="32" y="678" width="200" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="32" y="694" width="260" height="10" rx="3" fill="#E2E8F0"/>

  <!-- CTA (disabled) -->
  <rect x="16" y="726" width="358" height="48" rx="14" fill="#FEE2E2"/>
  <text x="195" y="756" font-size="14" font-weight="700" text-anchor="middle" fill="#FCA5A5">Check My Score →</text>

  <!-- Bottom nav - floating pill bar (Home · Calculator · Reminders · Finance) -->
  <rect x="12" y="798" width="366" height="42" rx="21" fill="#FFFFFF"/>
  <rect x="268" y="801" width="104" height="36" rx="18" fill="#4F46E5"/>
  <text x="60" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="230" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <text x="320" y="824" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">Finance</text>
</svg>
