  <text x="195" y="141" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">July 2026</text>
  <text x="354" y="141" font-size="18" text-anchor="right" fill="#4F46E5">›</text>

  <!-- Summary cards row 1 -->
  <!-- Total Income card -->
