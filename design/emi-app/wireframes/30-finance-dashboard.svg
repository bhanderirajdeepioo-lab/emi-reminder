  <text x="28" y="220" font-size="22" font-weight="800" fill="#059669">₹85,000</text>
  <rect x="28" y="228" width="40" height="4" rx="2" fill="#059669" opacity="0.3"/>
  <!-- Up arrow indicator -->
  <text x="154" y="188" font-size="11" text-anchor="middle" fill="#059669">↑</text>

  <!-- Total EMIs card -->
