  <text x="358" y="581" font-size="13" font-weight="700" text-anchor="end" fill="#DC2626">−₹8,500</text>
  <rect x="292" y="594" width="62" height="16" rx="4" fill="#FEE2E2"/>
  <text x="323" y="606" font-size="9" text-anchor="middle" fill="#DC2626">EMI</text>

