  <text x="358" y="635" font-size="13" font-weight="700" text-anchor="end" fill="#1E293B">−₹3,299</text>
  <rect x="286" y="648" width="68" height="16" rx="4" fill="#EDE9FE"/>
  <text x="320" y="660" font-size="9" text-anchor="middle" fill="#7C3AED">Shopping</text>

  <!-- Transaction 3 -->
  <rect x="16" y="670" width="358" height="48" rx="12" fill="#FFFFFF"/>
  <rect x="28" y="680" width="28" height="28" rx="8" fill="#FEE2E2"/>
  <text x="42" y="699" font-size="14" text-anchor="middle">🏦</text>
  <text x="68" y="689" font-size="12" font-weight="600" fill="#1E293B">ICICI EMI Debit</text>
  <text x="68" y="706" font-size="10" fill="#94A3B8">1 Jul · a/c ****7712</text>
  <text x="358" y="689" font-size="13" font-weight="700" text-anchor="end" fill="#DC2626">−₹12,500</text>
  <rect x="292" y="702" width="62" height="16" rx="4" fill="#FEE2E2"/>
  <text x="323" y="714" font-size="9" text-anchor="middle" fill="#DC2626">EMI</text>

