  <text x="212" y="186" font-size="10" fill="#64748B">Total EMIs</text>
  <text x="212" y="220" font-size="22" font-weight="800" fill="#DC2626">₹23,500</text>
  <rect x="212" y="228" width="40" height="4" rx="2" fill="#DC2626" opacity="0.3"/>
  <text x="356" y="188" font-size="10" text-anchor="middle" fill="#DC2626">3 active</text>

  <!-- Total Expenses card -->
