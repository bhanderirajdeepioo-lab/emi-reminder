<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"
     font-family="-apple-system, system-ui, sans-serif" stroke="none">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#F0FDF4"/>

  <!-- Status bar -->
  <rect width="390" height="48" fill="#16A34A"/>
  <text x="16" y="32" font-size="12" fill="#DCFCE7">9:41</text>
  <rect x="340" y="16" width="36" height="16" rx="3" fill="none" stroke="#DCFCE7" stroke-width="1.5"/>
  <rect x="342" y="19" width="24" height="10" rx="1" fill="#DCFCE7"/>

  <!-- Coming-soon ribbon -->
  <rect width="390" height="20" y="48" fill="#15803D"/>
  <text x="195" y="62" font-size="10" font-weight="700" text-anchor="middle" fill="#DCFCE7">🔒  COMING SOON — Launching Q3 2026</text>

  <!-- Header -->
  <rect x="0" y="68" width="390" height="56" fill="url(#hdr)"/>
  <text x="20" y="104" font-size="20" fill="#FFFFFF">←</text>
  <text x="195" y="104" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">PPF Calculator</text>

  <!-- Yearly Investment card -->
  <rect x="16" y="136" width="358" height="80" rx="14" fill="#FFFFFF"/>
  <text x="32" y="156" font-size="11" fill="#64748B">Yearly Investment (max ₹1,50,000)</text>
  <text x="32" y="192" font-size="26" font-weight="800" fill="#1E293B">₹ 1,50,000</text>
  <rect x="32" y="204" width="322" height="5" rx="2.5" fill="#DCFCE7"/>
  <rect x="32" y="204" width="290" height="5" rx="2.5" fill="url(#bar)"/>
  <circle cx="322" cy="206" r="9" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Period + Rate row -->
  <rect x="16" y="228" width="172" height="72" rx="14" fill="#FFFFFF"/>
  <text x="32" y="248" font-size="11" fill="#64748B">Investment Period</text>
  <rect x="32" y="256" width="32" height="28" rx="8" fill="#F0FDF4"/>
  <text x="48" y="275" font-size="16" text-anchor="middle" fill="#16A34A">−</text>
  <text x="104" y="277" font-size="20" font-weight="800" text-anchor="middle" fill="#1E293B">15 Yrs</text>
  <rect x="148" y="256" width="32" height="28" rx="8" fill="#F0FDF4"/>
  <text x="164" y="275" font-size="16" text-anchor="middle" fill="#16A34A">+</text>

  <rect x="202" y="228" width="172" height="72" rx="14" fill="#FFFFFF"/>
  <text x="218" y="248" font-size="11" fill="#64748B">Interest Rate (Govt. Fixed)</text>
  <text x="218" y="278" font-size="26" font-weight="800" fill="#16A34A">7.1%</text>
  <text x="218" y="295" font-size="10" fill="#94A3B8">Updated Q1 2026</text>

  <!-- Extension chips -->
  <rect x="16" y="312" width="358" height="44" rx="14" fill="#FFFFFF"/>
  <text x="32" y="330" font-size="11" fill="#64748B">Extension blocks after maturity</text>
  <rect x="32" y="340" width="68" height="10" rx="5" fill="#16A34A"/>
  <text x="66" y="349" font-size="9" text-anchor="middle" fill="#FFFFFF">+5 Yrs</text>
  <rect x="108" y="340" width="68" height="10" rx="5" fill="#DCFCE7"/>
  <text x="142" y="349" font-size="9" text-anchor="middle" fill="#15803D">+10 Yrs</text>
  <rect x="184" y="340" width="56" height="10" rx="5" fill="#DCFCE7"/>
  <text x="212" y="349" font-size="9" text-anchor="middle" fill="#15803D">None</text>

  <!-- Section label -->
  <text x="16" y="376" font-size="11" font-weight="700" fill="#64748B">MATURITY BREAKDOWN</text>

  <!-- Hero result (locked) -->
  <rect x="16" y="384" width="358" height="76" rx="16" fill="#1E293B"/>
  <text x="195" y="416" font-size="12" text-anchor="middle" fill="#64748B">Maturity Value</text>
  <text x="195" y="452" font-size="28" font-weight="800" text-anchor="middle" fill="#334155">₹ ——,——,———</text>

  <!-- 3-up result cards (locked) -->
  <rect x="16" y="472" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="70" y="494" font-size="10" text-anchor="middle" fill="#94A3B8">Total Invested</text>
  <text x="70" y="526" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,——,———</text>

  <rect x="141" y="472" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="195" y="494" font-size="10" text-anchor="middle" fill="#94A3B8">Interest Earned</text>
  <text x="195" y="526" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">₹——,——,———</text>

  <rect x="266" y="472" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="320" y="494" font-size="10" text-anchor="middle" fill="#94A3B8">Return</text>
  <text x="320" y="526" font-size="15" font-weight="700" text-anchor="middle" fill="#CBD5E1">—.—×</text>

  <!-- Coming soon card -->
  <rect x="16" y="552" width="358" height="90" rx="16" fill="#FFFFFF"/>
  <text x="195" y="588" font-size="24" text-anchor="middle">🔒</text>
  <text x="195" y="614" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">PPF Calculator Coming Soon</text>
  <text x="195" y="632" font-size="11" text-anchor="middle" fill="#64748B">Tax-free returns at 7.1% p.a. — launching Q3 2026</text>

  <!-- Year-wise table placeholder -->
  <rect x="16" y="654" width="358" height="68" rx="14" fill="#F8FAFC"/>
  <text x="32" y="676" font-size="11" font-weight="700" fill="#CBD5E1">Year-wise Accumulation Table</text>
  <rect x="32" y="686" width="200" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="32" y="702" width="260" height="10" rx="3" fill="#E2E8F0"/>

  <!-- CTA (disabled) -->
  <rect x="16" y="734" width="358" height="48" rx="14" fill="#DCFCE7"/>
  <text x="195" y="764" font-size="14" font-weight="700" text-anchor="middle" fill="#86EFAC">Calculate PPF Returns →</text>

  <!-- Bottom nav - floating pill bar (Home · Calculator · Reminders · Finance) -->
  <rect x="12" y="798" width="366" height="42" rx="21" fill="#FFFFFF"/>
  <rect x="268" y="801" width="104" height="36" rx="18" fill="#4F46E5"/>
  <text x="60" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Home</text>
  <text x="147" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Calculator</text>
  <text x="230" y="824" font-size="10" text-anchor="middle" fill="#94A3B8">Reminders</text>
  <text x="320" y="824" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">Finance</text>
</svg>
