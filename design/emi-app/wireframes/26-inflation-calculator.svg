  <text x="195" y="526" font-size="13" font-weight="700" text-anchor="middle" fill="#CBD5E1">—.—%</text>

  <rect x="266" y="472" width="108" height="68" rx="14" fill="#F8FAFC"/>
  <text x="320" y="494" font-size="10" text-anchor="middle" fill="#94A3B8">Extra Needed</text>
